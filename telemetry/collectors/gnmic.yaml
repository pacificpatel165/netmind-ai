# gnmic subscription config — component #2 (verified stage 1) plus the
# Prometheus output for component #3 (metrics store, direct-scrape,
# decided 2026-09-10 over a Kafka buffer — see metrics/README.md).
#
# Same subscription set feeds both outputs below: the file (component
# #2's original validation output, still useful for raw inspection) and
# the Prometheus scrape endpoint (what actually matters going forward).
#
# Verify against the installed gnmic version on first run — path names
# and output-plugin field names can shift slightly between gnmic
# releases (this was written against gnmic 0.48.0, installed
# 2026-09-10 — confirmed via `gnmic subscribe ... --debug` output).

targets:
  srl1:
    address: clab-netmind-2node-srl1:57400
    username: admin
    password: NokiaSrl1!
    skip-verify: true
  srl2:
    address: clab-netmind-2node-srl2:57400
    username: admin
    password: NokiaSrl1!
    skip-verify: true

subscriptions:
  interface-state:
    paths:
      - /interface[name=*]/oper-state
      - /interface[name=*]/admin-state
      - /interface[name=*]/statistics
    stream-mode: sample
    sample-interval: 10s
    encoding: json_ietf

outputs:
  telemetry-file:
    type: file
    filename: /var/log/gnmic/netmind-telemetry.jsonl
    format: event

  # Component #3: exposes a Prometheus scrape endpoint directly —
  # scraped by metrics/prometheus/prometheus.yml's `netmind-gnmic` job.
  # metric-prefix keeps everything under one recognizable namespace
  # (e.g. netmind_srl_nokia_interfaces_interface_oper_state) rather than
  # colliding with any other exporter's metric names.
  telemetry-prometheus:
    type: prometheus
    listen: :9804
    path: /metrics
    metric-prefix: netmind
    append-subscription-name: true
    export-timestamps: false
    strings-as-labels: true
