# NetMind AI — component #1 (network lab), stage 1 topology.
#
# Two Nokia SR Linux nodes connected by a single point-to-point link.
# Purpose: get containerlab + SR Linux working end to end, and give
# component #2 (telemetry collector) a live gNMI target before any
# topology complexity is added.
#
# Design note — lab/K8s relationship (locked 2026-09-10):
# This lab is meant to sit *underneath* the phase-2 Kubernetes/Cilium
# cluster, not next to it as an unrelated sibling. Each node reserves a
# second interface (e1-2) specifically for that attachment, so the
# topology didn't need to be redesigned when K8s showed up.
#
# Update, 2026-09-18 (BACKLOG.md item 4, second half): srl1's e1-2 is
# now wired to containerlab's reserved "host" node below -- a veth
# straight into the WSL2 host's own network namespace, the same one
# k3s + Cilium already run natively in. This is the underlay attachment
# point Cilium will BGP-peer over. srl2's e1-2 stays unused for now --
# only one K8s attachment point is needed for this single-node cluster.
#
# IMPORTANT — deploy from native Linux filesystem, not /mnt/c/...:
# WSL2's DrvFs (the /mnt/c/... view of the Windows drive) doesn't support
# the POSIX permission bits SR Linux needs to chmod its own config files
# during commit, which makes postdeploy fail with "Setting permissions
# for file '/etc/opt/srlinux/config.tmp' failed ... [Operation not
# permitted]". This file (and the gnmic config it bind-mounts below) are
# the source of truth, kept in git on the Windows drive — but always
# sync the whole repo to a native path before deploying:
#
#   bash /mnt/c/MyWorkSpace/AI-Projects/NetMind-AI/scripts/sync-to-lab.sh
#   cd ~/netmind-lab/lab/topologies
#   sudo clab deploy -t netmind-2node.clab.yml
#
# (sync-to-lab.sh mirrors the whole repo, not just this file, because
# the gnmic bind mount below needs its config alongside it on native fs.)
#
# Destroy:
#   sudo clab destroy -t netmind-2node.clab.yml --cleanup

name: netmind-2node

topology:
  kinds:
    srl:
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2 # containerlab warns "ixrd2" is deprecated (removed after Jan 2026); this is the current dashed form
    # No default image for the `linux` kind — gnmic and prometheus both
    # use it but need different images, so each node sets its own below.

  nodes:
    srl1:
      kind: srl
      mgmt-ipv4: 172.100.100.11
    srl2:
      kind: srl
      mgmt-ipv4: 172.100.100.12

    # Component #2: telemetry collector. Subscribes to srl1/srl2 over
    # gNMI (they're reachable on the shared netmind-mgmt network below)
    # and writes to a file for now — see telemetry/collectors/gnmic.yaml
    # and telemetry/README.md for the subscription design.
    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic:latest
      mgmt-ipv4: 172.100.100.20
      binds:
        - ../../telemetry/collectors/gnmic.yaml:/etc/gnmic/gnmic.yaml:ro
        # /var/log/gnmic doesn't exist in the image and gnmic's file
        # output won't create a missing parent dir (fails silently at
        # default log level — only visible with --debug). Bind-mounting
        # a host dir onto it both fixes that (docker creates the mount
        # point) and makes the output readable from the WSL shell
        # directly, no docker exec required.
        - ../../telemetry/output:/var/log/gnmic
      cmd: subscribe --config /etc/gnmic/gnmic.yaml

    # Component #3: metrics store. Scrapes gnmic's Prometheus output
    # (port 9804, added above) directly — no Kafka buffer, decided
    # 2026-09-10 — see metrics/README.md and metrics/prometheus/prometheus.yml.
    # No persistent data volume yet: stage 1 only needs to prove the
    # scrape works, and a bind-mounted /prometheus would hit the same
    # class of permission mismatch gnmic's file output did (container
    # runs as its own `nobody` user, host dir owned by `clab`) for no
    # benefit yet — data can live and die with the container for now.
    prometheus:
      kind: linux
      image: prom/prometheus:latest # verify tag resolves on first deploy, like gnmic's image was
      mgmt-ipv4: 172.100.100.30
      binds:
        - ../../metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml --web.listen-address=:9090
      ports:
        - "9090:9090" # so the Prometheus UI is reachable at http://localhost:9090 from Windows

    # Component #4: dashboards. Provisioned as code — datasource and
    # dashboard JSON are both committed under grafana/provisioning/ and
    # grafana/dashboards/, auto-loaded on container start rather than
    # clicked together in the UI. See grafana/README.md.
    grafana:
      kind: linux
      image: grafana/grafana:latest # verify tag resolves on first deploy, like gnmic's/prometheus's images were
      mgmt-ipv4: 172.100.100.40
      binds:
        - ../../grafana/provisioning:/etc/grafana/provisioning:ro
        - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: NetMindGrafana1! # lab-only credential, not a production secret
        GF_AUTH_ANONYMOUS_ENABLED: "true" # convenience for local lab viewing; not meant for anything beyond localhost
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      ports:
        - "3000:3000" # Grafana UI reachable at http://localhost:3000 from Windows

    # Component #5: anomaly detection. Queries Prometheus for a rolling
    # baseline (avg/stddev over a window) per interface counter,
    # computes a z-score, and exposes it back as its own Prometheus
    # metrics — see intelligence/anomaly-detection/README.md. No ML/LLM
    # yet, deliberately: a statistical baseline first, per the roadmap.
    #
    # No public image exists for this — it's project code, built
    # locally before first deploy:
    #   cd intelligence/anomaly-detection && docker build -t netmind-anomaly-detector:latest .
    anomaly-detector:
      kind: linux
      image: netmind-anomaly-detector:latest
      mgmt-ipv4: 172.100.100.50
      env:
        PROMETHEUS_URL: http://clab-netmind-2node-prometheus:9090
        EVAL_INTERVAL_SECONDS: "30"
        BASELINE_WINDOW: 15m
        ZSCORE_THRESHOLD: "3.0"
      ports:
        - "9805:9805" # for ad hoc `curl http://localhost:9805/metrics` from Windows

    # Component #6: retrieval index. Vector store for this project's own
    # docs (README/design docs), chunked + embedded by
    # intelligence/retrieval-index/ingest.py and queried by query.py —
    # see intelligence/retrieval-index/README.md. Ingestion/query are
    # run on demand (docker run against this network), not topology
    # nodes of their own — only the store itself needs to stay up.
    #
    # No persistent volume yet, same deliberate simplification as
    # Prometheus in component #3 — re-run ingest.py after every
    # redeploy rather than solving storage-permission ownership before
    # the retrieval pattern itself is proven. See docs/roadmap/BACKLOG.md.
    chroma:
      kind: linux
      # Pinned, not :latest — the netmind-retrieval-tools client is
      # built against chromadb==0.5.23, and :latest resolved to a much
      # newer server whose collection-config JSON schema that client
      # can't parse (KeyError: '_type' in CollectionConfigurationInternal.from_json).
      # Server and client versions have to move together; see
      # intelligence/retrieval-index/README.md.
      image: chromadb/chroma:0.5.23
      mgmt-ipv4: 172.100.100.60
      ports:
        - "8000:8000" # Chroma's REST API, reachable from Windows for ad hoc checks

  links:
    # Data-plane link between the two nodes. This is the path
    # component #2 will stream gNMI telemetry from.
    - endpoints: ["srl1:e1-1", "srl2:e1-1"]

    # e1-2 on srl1: the reserved attachment point for the K8s/Cilium
    # underlay (BACKLOG.md item 4, second half). "host" is containerlab's
    # reserved node name -- it does not create a new container, it
    # creates a veth pair with one end inside srl1's own network
    # namespace (named e1-2, same as any other srl1 interface) and the
    # other end landing directly in the WSL2 host's root network
    # namespace, named "srl1_e1-2" there. That's the same namespace k3s
    # and Cilium already run natively in (see docs/setup/01-network-lab-environment.md's
    # "why not Docker Desktop's K8s toggle" reasoning) -- so this one
    # link is what makes it possible for Cilium to actually reach srl1
    # at all, without going through any container network boundary.
    # Verified against containerlab's own docs before adding this
    # (https://containerlab.dev/manual/network/) -- not guessed.
    - endpoints: ["srl1:e1-2", "host:srl1_e1-2"]

    # srl2's e1-2 stays undeclared for now -- only srl1 needs a K8s
    # attachment point for this single-node k3s cluster; srl2 remains
    # reachable from Kubernetes indirectly, via srl1, once BGP is up.

mgmt:
  network: netmind-mgmt
  ipv4-subnet: 172.100.100.0/24
